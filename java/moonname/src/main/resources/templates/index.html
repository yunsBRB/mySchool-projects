<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoonName</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<main>
    <h1>MoonName</h1>
    <p>envoie ta pierre to the moon</p>

    <h2>Missions</h2>
    <ul>
        <li th:each="mission : ${missions}">
            <b th:text="${mission.nom}"></b> — <span th:text="${mission.dateDepart}"></span>
        </li>
    </ul>

    <h2>Pierres</h2>
    <ul>
        <li th:each="pierre : ${pierres}">
            <b th:text="${pierre.inscription}"></b> — <span th:text="${pierre.statut}"></span>
        </li>
    </ul>

    <p><a href="/swagger-ui/index.html">Ouvrir Swagger</a></p>
</main>
</body>
</html>
