
<div class="products">
  @for (p of products; track p.id) {
    <div class="product-card">
      <img [src]="p.imageUrl" [alt]="p.name">

      <div>
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <p>{{ p.price }} €</p>
      </div>
    </div>
  } @empty {
    <p>y'a pas de produit </p>
  }
</div>
